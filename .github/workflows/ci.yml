name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow || 'CI' }}-${{ github.event.pull_request.number || github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint

      - name: Check formatting
        # Non-blocking until Phase 6 reformats. Do not make this blocking here.
        continue-on-error: true
        run: npm run format:check

      - name: Lint workflows
        # Scoped to ci.yml in Phase 0; Phase 1 fixes release.yml/e2e-tests.yml
        # shellcheck findings and removes the scoping.
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color .github/workflows/ci.yml

      - name: Scan for secrets
        run: |
          # Fail loudly if the mount is not a git repo — gitleaks exits 0 in that case.
          docker run --rm -v "$PWD:/repo" --entrypoint /bin/sh zricethezav/gitleaks:v8.30.1 \
            -c 'test -e /repo/.git' || { echo "::error::gitleaks mount is not a git repo"; exit 1; }
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --no-banner --redact

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Snapshot dist (non-git fallback)
        run: |
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "Git worktree detected; will use git diff for verification."
            exit 0
          fi

          echo "No git worktree detected; snapshotting dist for diff verification."
          rm -rf /tmp/dist.before
          mkdir -p /tmp/dist.before
          if [ -d dist ]; then
            cp -a dist/. /tmp/dist.before/
          fi
      - run: npm run package
      - name: Verify clean (git) or dist unchanged (fallback)
        run: |
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git diff --exit-code
            exit 0
          fi

          mkdir -p dist
          diff -ru /tmp/dist.before dist
