name: Test Docker Image
description: Generic Docker image testing with healthcheck and s6 service validation
author: LiquidLogicLabs
inputs:
  image:
    description: Full image name with tag (e.g., registry/org/image:tag)
    required: true
  timeout:
    description: Overall test timeout in seconds
    required: false
    default: "120"
  startup-timeout:
    description: Container startup timeout in seconds
    required: false
    default: "60"
  minimal-env:
    description: 'JSON object of minimal environment variables (default: {"PUID":"1000","PGID":"1000","TZ":"UTC"})'
    required: false
    default: "{\"PUID\":\"1000\",\"PGID\":\"1000\",\"TZ\":\"UTC\"}"
  skip-healthcheck:
    description: Skip healthcheck verification
    required: false
    default: "false"
  skip-s6-check:
    description: Skip s6 service verification
    required: false
    default: "false"
  required-services:
    description: Comma-separated list of required s6 services (auto-detected if not provided)
    required: false
    default: ""
  error-patterns:
    description: Additional error patterns to detect (JSON array)
    required: false
    default: "[]"
  mount-docker-socket:
    description: Mount /var/run/docker.sock into container (read-only)
    required: false
    default: "false"
  verbose:
    description: Enable verbose logs. Also enabled when ACTIONS_STEP_DEBUG=true.
    required: false
    default: "false"
outputs:
  status:
    description: "Test status: success or failure"
  logs:
    description: Container logs (on failure)
  healthcheck-detected:
    description: Whether healthcheck was detected in image
  services-detected:
    description: List of s6 services detected (JSON array)
runs:
  using: 'node24'
  main: dist/index.js
branding:
  icon: "check-circle"
  color: "blue"
