name: E2E

# E2E runs only on release (workflow_call from release.yml) or manual trigger — not in CI.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow || 'E2E Tests' }}-${{ github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: non-s6-whoami
            image: traefik/whoami:v1.10.3
            timeout: "60"
            startupTimeout: "10"
            skipHealthcheck: "false"
            skipS6Check: "false"
            expectHealthcheckDetected: "false"
            expectServicesMin: 0

          - name: s6-linuxserver-baseimage
            image: ghcr.io/linuxserver/baseimage-alpine:3.20
            timeout: "120"
            startupTimeout: "30"
            skipHealthcheck: "false"
            skipS6Check: "false"
            expectHealthcheckDetected: "false"
            expectServicesMin: 1

    name: ${{ matrix.name }}
    # Run action from committed dist only (no build). Ensures E2E fails if dist is unbundled.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No step in this job pushes; the credential is not needed.
          persist-credentials: false

      - name: Pull fixture image
        env:
          Z_MATRIX_IMAGE: ${{ matrix.image }}
        run: docker pull "${Z_MATRIX_IMAGE}"

      - name: Run action
        id: run_action
        uses: ./  # zizmor: ignore[self-repository] — local ACTION reference under test, not a reusable-workflow call; $/ does not apply
        with:
          image: ${{ matrix.image }}
          timeout: ${{ matrix.timeout }}
          startup-timeout: ${{ matrix.startupTimeout }}
          skip-healthcheck: ${{ matrix.skipHealthcheck }}
          skip-s6-check: ${{ matrix.skipS6Check }}
          verbose: "true"

      - name: Assert outputs
        env:
          SERVICES_DETECTED_JSON: ${{ steps.run_action.outputs.services-detected }}
          HEALTHCHECK_DETECTED: ${{ steps.run_action.outputs.healthcheck-detected }}
          STATUS: ${{ steps.run_action.outputs.status }}
          EXPECT_HEALTHCHECK_DETECTED: ${{ matrix.expectHealthcheckDetected }}
          EXPECT_SERVICES_MIN: ${{ matrix.expectServicesMin }}
          Z_MATRIX_IMAGE: ${{ matrix.image }}
        run: |
          echo "image=${Z_MATRIX_IMAGE}"
          echo "status=${STATUS}"
          echo "healthcheckDetected=${HEALTHCHECK_DETECTED}"
          echo "servicesDetected=${SERVICES_DETECTED_JSON}"

          test "${STATUS}" = "success"
          test "${HEALTHCHECK_DETECTED}" = "${EXPECT_HEALTHCHECK_DETECTED}"

          node -e '
            const servicesJson = process.env.SERVICES_DETECTED_JSON;
            const min = Number(process.env.EXPECT_SERVICES_MIN || "0");
            const arr = JSON.parse(servicesJson || "[]");
            if (!Array.isArray(arr)) process.exit(1);
            if (arr.length < min) process.exit(1);
          '
